[project]
name = "brain"
version = "0.1.0"
description = "Личная память для Claude: учебная пересборка второго мозга"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
brain = "brain:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
